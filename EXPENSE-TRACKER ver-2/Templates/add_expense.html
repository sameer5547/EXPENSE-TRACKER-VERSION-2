<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Expense - Expense Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="add-expense-body">


    <!-- FLASH MESSAGES -->

    <div id="flash-container">

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="flash-message {{ category }}">

                    <span>{{ message }}</span>

                    <button type="button"
                            onclick="closeFlash(this)">
                        ×
                    </button>

                </div>

            {% endfor %}

        {% endwith %}

    </div>


    <!-- ADD EXPENSE CONTAINER -->

    <div class="add-expense-container">

        <div class="add-expense-card">

            <h1>ADD EXPENSE</h1>

            <p class="form-subtitle">
                Record a new expense
            </p>


            <form method="POST"
                  action="/add">


                <!-- AMOUNT -->

                <div class="form-group">

                    <label for="amount">
                        AMOUNT
                    </label>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        step="0.01"
                        min="0.01"
                        placeholder="Enter amount"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="category">
                        CATEGORY
                    </label>

                    <input
                        type="text"
                        id="category"
                        name="category"
                        placeholder="Example: Food"
                        required
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        DESCRIPTION
                    </label>

                    <input
                        type="text"
                        id="description"
                        name="description"
                        placeholder="What did you spend on?"
                        required
                    >

                </div>


                <!-- DATE -->

                <div class="form-group">

                    <label for="date">
                        DATE
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >

                </div>


                <!-- BUTTONS -->

                <div class="form-buttons">

                    <button type="submit"
                            class="save-expense-btn">
                        ADD EXPENSE
                    </button>


                    <a href="/"
                       class="cancel-expense-btn">
                        CANCEL
                    </a>

                </div>

            </form>

        </div>

    </div>


    <!-- FLASH SCRIPT -->

    <script>

        function closeFlash(button) {

            const message =
                button.closest(".flash-message");

            if (message) {

                message.style.animation =
                    "flashOut 0.3s ease forwards";

                setTimeout(() => {

                    message.remove();

                }, 300);

            }

        }


        document
            .querySelectorAll(".flash-message")
            .forEach(message => {

                setTimeout(() => {

                    if (message.isConnected) {

                        message.style.animation =
                            "flashOut 0.3s ease forwards";

                        setTimeout(() => {

                            message.remove();

                        }, 300);

                    }

                }, 4000);

            });

    </script>

</body>

</html>
