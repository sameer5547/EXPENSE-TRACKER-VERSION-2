
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='auth.css') }}">

    <title>Reset Password | Expense Tracker</title>
</head>

<body class="login-body">

    <div class="reset-container">

        <div class="reset-card">
            <h1>Reset Password</h1>
            <p class="reset-subtitle">
                Create a new password for your account.
            </p>

            <form onsubmit="event.preventDefault(); changePassword();">

                <label for="resetPassword">New Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        name="password"
                        id="resetPassword"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('resetPassword', this)"
                        aria-label="Show password"
                        aria-pressed="false"
                    >👁</button>
                </div>

                <label for="confirmPassword">Confirm Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        name="confirm_password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('confirmPassword', this)"
                        aria-label="Show password"
                        aria-pressed="false"
                    >👁</button>
                </div>

                <button type="submit" class="reset-submit">
                    Change Password
                </button>

            </form>

            <a href="{{ url_for('login') }}" class="back-login">
                Back to Login
            </a>
        </div>

    </div>

<script>
function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);
    const isHidden = input.type === "password";

    input.type = isHidden ? "text" : "password";
    button.textContent = isHidden ? "🙈" : "👁";
    button.setAttribute("aria-label",
        isHidden ? "Hide password" : "Show password");
    button.setAttribute("aria-pressed", String(isHidden));
}

async function changePassword() {
    const password = document.getElementById("resetPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    if (password.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
    }

    const hash = window.location.hash;

    if (!hash) {
        alert("Invalid or expired reset link.");
        return;
    }

    const params = new URLSearchParams(hash.substring(1));
    const accessToken = params.get("access_token");
    const refreshToken = params.get("refresh_token");

    if (!accessToken || !refreshToken) {
        alert("Invalid reset session.");
        return;
    }

    const submitButton = document.querySelector(".reset-submit");
    submitButton.disabled = true;
    submitButton.textContent = "Updating...";

    try {
        const response = await fetch("/api/reset-password", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                access_token: accessToken,
                refresh_token: refreshToken,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.error || "Password reset failed.");
            return;
        }

        alert("Password changed successfully!");
        window.location.href = "/login";

    } catch (error) {
        console.error(error);
        alert("Something went wrong. Please try again.");
    } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Change Password";
    }
}
</script>

</body>
</html>
