<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static',filename='auth.css')}}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>LOGIN - Expense Tracker</title>
</head>

<body>
    <div id="flash-container">

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="flash-message {{ category }}">

                <span class="flash-text">
                    {{ message }}
                </span>

                <button
                    type="button"
                    class="flash-close"
                    onclick="closeFlash(this)"
                >
                    ×
                </button>

            </div>

        {% endfor %}

    {% endwith %}

</div>

    <h1>EXPENSE TRACKER</h1>

    <form method="POST" action="/login">

        <label>Email:</label>
        <input type="email" name="email" required>

        <br><br>

       <!-- Password Container -->
<div class="password-wrapper">
  <input type="password" id="password" name="password" placeholder="Enter your password" required>
  <button type="button" class="toggle-eye" id="togglePassword" aria-label="Show password">
    <i class="fa-solid fa-eye"></i>
  </button>
</div>

        <br><br>

        <button type="submit">Login</button>

    </form>
    <p>
    <a href="/forgot-password">Forgot Password?</a>
   </p>

    <p>
        Don't have an account?
        <a href="/signup">Create Account</a>
    </p>
<script>
   const pwd = document.getElementById("password");
  const eye = document.getElementById("togglePassword");
  const icon = eye.querySelector("i");

  eye.addEventListener("click", () => {
    const show = pwd.type === "password";
    pwd.type = show ? "text" : "password";
    icon.classList.toggle("fa-eye", !show);
    icon.classList.toggle("fa-eye-slash", show);
  });
function closeFlash(button) {

    const message =
        button.closest(".flash-message");

    if (!message) {
        return;
    }

    message.style.animation =
        "popupSlideOut 0.3s ease forwards";

    setTimeout(function() {

        message.remove();

    }, 300);
}


/* Automatically hide popup after 4 seconds */

document.querySelectorAll(".flash-message")
    .forEach(function(message) {

        setTimeout(function() {

            message.style.animation =
                "popupSlideOut 0.3s ease forwards";

            setTimeout(function() {

                message.remove();

            }, 300);

        }, 4000);

    });
</script>
</body>
</html>
