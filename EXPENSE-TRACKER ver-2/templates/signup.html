<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="display: grid; place-items: center; min-height: 100vh; padding: 1rem;">

    <!-- Flash Messages -->
    <div id="flash-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-message {{ category }}">
                    <span class="flash-text">{{ message }}</span>
                    <button type="button" class="flash-close" onclick="closeFlash(this)">&times;</button>
                </div>
            {% endfor %}
        {% endwith %}
    </div>

    <div class="card" style="width: 100%; max-width: 420px; background: var(--card-bg); border: 1px solid var(--borders); border-radius: var(--r-lg); padding: 2.25rem; box-shadow: var(--shadow);">
        
        <h1 style="margin: 0 0 0.5rem; font-size: 1.75rem; text-align: center;">Create Account</h1>
        <p style="margin: 0 0 1.75rem; color: var(--secondary-text); font-size: 0.9rem; text-align: center;">
            Start tracking your expenses and budgeting smarter.
        </p>

        <form method="POST" action="/signup">
            <div class="field" style="margin-bottom: 1.25rem;">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" autocomplete="name">
            </div>

            <div class="field" style="margin-bottom: 1.25rem;">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
            </div>

            <div class="field" style="margin-bottom: 1.75rem;">
                <label for="password">Password</label>
                <div class="password-wrapper" style="position: relative;">
                    <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required style="padding-right: 3rem;">
                    <button type="button" class="toggle-eye" id="togglePassword" aria-label="Show password" style="position: absolute; right: 0.25rem; top: 50%; transform: translateY(-50%); background: transparent; border: none; min-height: 38px; min-width: 38px; color: var(--secondary-text); cursor: pointer;">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" style="width: 100%; margin: 0;">Sign Up</button>
        </form>

        <p style="margin: 1.5rem 0 0; text-align: center; color: var(--secondary-text); font-size: 0.9rem;">
            Already have an account? <a href="/login">Login</a>
        </p>
    </div>

    <script>
        const pwd = document.getElementById("password");
        const eye = document.getElementById("togglePassword");
        const icon = eye.querySelector("i");

        eye.addEventListener("click", () => {
            const show = pwd.type === "password";
            pwd.type = show ? "text" : "password";
            icon.classList.toggle("fa-eye", !show);
            icon.classList.toggle("fa-eye-slash", show);
        });

        function closeFlash(button) {
            const message = button.closest(".flash-message");
            if (message) {
                message.style.opacity = "0";
                setTimeout(() => message.remove(), 300);
            }
        }
    </script>
</body>
</html>
